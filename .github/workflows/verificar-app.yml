name: Verificar app

# The patch workflows only look at patches/**, so a change to the app itself had
# no automated check at all. This one covers that gap: types, lint and the data
# layer contract, on every PR that touches app code.
# This job is a required status check on main, and that removes the option of
# skipping it. A `paths-ignore` list used to sit here, so a docs-only pull
# request never ran this workflow — which is fine until the check is required,
# at which point GitHub waits forever for a report that will never arrive and
# the pull request can never merge.
#
# So it runs on every pull request, including the ones that only touch Markdown.
# That costs a few minutes of CI on changes that cannot break anything. The
# alternative is a required check that sometimes does not report, which is worse
# than wasteful: it is a gate that quietly stops being a gate.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verificar-app-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # next-env.d.ts is gitignored, and tsc needs it to know about the Next
      # types. next build writes it, but the type check runs first — so recreate
      # the two reference lines rather than reordering the whole job.
      - name: Recriar next-env.d.ts
        run: |
          printf '/// <reference types="next" />\n/// <reference types="next/image-types/global" />\n' > next-env.d.ts

      - name: Tipos
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # Contract tests for the data layer. No test framework: Node 22 strips the
      # types itself and scripts/ts-resolve-hook.mjs supplies the extensionless
      # and @/ resolution that Next does and plain Node does not.
      # Um manifesto de animação que pede um dado inexistente compila e roda —
      # o valor fica em zero e a animação parece só estar parada. O validador é
      # quem transforma isso em erro com sugestão de grafia.
      - name: Validar animações declaradas
        run: npm run compositions:validate

      - name: Testes de contrato
        run: npm test

      # The build loads every route module, and three of them fail closed when
      # their configuration is absent: lib/usersdb.js throws without the Supabase
      # service key, and web-push rejects VAPID keys that are not real EC keys.
      # That is correct behaviour — a service_role client that silently starts
      # unconfigured would be worse — so CI supplies throwaway values instead of
      # weakening the checks.
      #
      # The VAPID pair is generated here rather than written down: nothing in this
      # file should look like key material, even when it is disposable.
      #
      # SATELLITE_API_URL is deliberately unreachable. The build has to succeed
      # anyway, which is the BUG-02 contract restated: a backend that is down
      # degrades to "fonte indisponível", it does not break the build.
      - name: Build
        run: |
          eval "$(node -e "const k=require('web-push').generateVAPIDKeys();console.log('export NEXT_PUBLIC_VAPID_PUBLIC_KEY='+k.publicKey+'; export VAPID_PRIVATE_KEY='+k.privateKey)")"
          npm run build
        env:
          SATELLITE_API_URL: https://exemplo.invalid/prod
          NEXT_PUBLIC_SUPABASE_URL: https://exemplo.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: chave-anon-de-build
          SUPABASE_SERVICE_ROLE_KEY: chave-service-de-build
          CRON_SECRET: segredo-de-build
