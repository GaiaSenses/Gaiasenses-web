name: Compilar patches Pd

# Only source changes trigger a build. The bot writes to public/patches,
# public/pd4web-runtime and the generated registry — none of which match this
# filter, so committing results back cannot start another run.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "patches/**"
      - "lib/gaia-vocabulary.json"
      - "lib/gaia-composition-events.json"
  workflow_dispatch:
    inputs:
      slugs:
        description: "Patches a recompilar, separados por vírgula. Vazio = todos."
        required: false
        default: ""

concurrency:
  group: patch-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinning the version pins the whole toolchain: Pd4Web bundles the Pure Data
  # and emscripten versions it builds with, so this one value decides the bytes
  # of the produced runtime. Never use "latest" — the CLI has already renamed
  # flags between releases.
  PD4WEB_VERSION: "3.3.0.post1"

jobs:
  detect:
    name: Detectar patches alterados
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]'
    outputs:
      slugs: ${{ steps.pick.outputs.slugs }}
      any: ${{ steps.pick.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: pick
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.slugs }}" ]; then
            SLUGS=$(echo "${{ inputs.slugs }}" | tr ',' '\n' | sed '/^$/d' | jq -R . | jq -sc .)
          elif [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            SLUGS=$(git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD -- patches/ \
                    | awk -F/ 'NF>1 {print $2}' | sort -u | jq -R . | jq -sc .)
          else
            SLUGS=$(ls patches | jq -R . | jq -sc .)
          fi
          echo "slugs=$SLUGS" >> "$GITHUB_OUTPUT"
          if [ "$SLUGS" = "[]" ]; then echo "any=false" >> "$GITHUB_OUTPUT"; else echo "any=true" >> "$GITHUB_OUTPUT"; fi
          echo "Patches alterados: $SLUGS"

  validate:
    name: Validar manifestos e patches
    needs: detect
    if: needs.detect.outputs.any == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci --prefer-offline --no-audit

      # Reads the manifests and cross-checks them against the receivers that
      # actually exist in the .pd files. This is what catches a typo that would
      # otherwise leave the patch silently unconnected.
      - run: npm run patches:validate
      - run: npm run patches:check

      # next-env.d.ts is generated by Next and gitignored, so a fresh checkout
      # does not have it — and it is what declares the *.png module types that
      # app/old-main/page.tsx imports. Without it `tsc` fails here while passing
      # on any machine that has run the app once, which is the worst kind of
      # CI-only failure. Recreating it is exactly what `next build` would do.
      - name: Recriar next-env.d.ts
        run: |
          printf '/// <reference types="next" />\n/// <reference types="next/image-types/global" />\n' > next-env.d.ts

      - run: npx tsc --noEmit

  build:
    name: Compilar ${{ matrix.slug }}
    needs: [detect, validate]
    if: needs.detect.outputs.any == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        slug: ${{ fromJSON(needs.detect.outputs.slugs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci --prefer-offline --no-audit

      # ubuntu-24.04 is required, not incidental: the only Linux wheel published
      # is manylinux_2_38, and ubuntu-22.04 ships glibc 2.35, where pip refuses
      # to install it.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar pd4web
        run: pip install "pd4web==${PD4WEB_VERSION}"

      # The wheel carries cmake and ninja but not emscripten, which is fetched on
      # first use into the package directory. Without this cache every build
      # re-downloads ~2.3 GB and recompiles the system libraries: about 6 minutes
      # cold against 1.5 warm.
      - name: Cachear toolchain do pd4web
        uses: actions/cache@v4
        with:
          path: ${{ env.pythonLocation }}/lib/python3.12/site-packages/pd4web/Pd4Web
          key: pd4web-toolchain-${{ runner.os }}-${{ env.PD4WEB_VERSION }}

      - name: Compilar e instalar o bundle
        run: node scripts/build-patch.mjs "${{ matrix.slug }}"
        env:
          PD4WEB_BIN: pd4web

      - name: Regenerar o registro
        run: npm run patches:codegen

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.slug }}
          path: |
            public/patches/${{ matrix.slug }}
            public/pd4web-runtime
          retention-days: 14

  publish:
    name: Commitar artefatos no PR
    needs: [detect, build]
    # Pull requests from forks run with a read-only token, and compiling an
    # arbitrary .pd with write access would be remote code execution. Those PRs
    # still build and upload an artifact; a maintainer applies it by hand.
    if: >
      needs.detect.outputs.any == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          # The default GITHUB_TOKEN is deliberate: pushes made with it do not
          # trigger workflows, which is the primary defence against a build loop.
          # Swapping it for a PAT would re-enable the loop.
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          merge-multiple: true
          path: public

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci --prefer-offline --no-audit
      - run: npm run patches:codegen

      # Content addressing dedupes identical runtimes but never reclaims. A build
      # on a runner mints different bytes than one on a laptop — the checkout
      # path is baked into the binary — so without this every machine that ever
      # builds leaves ~2 MB behind for good.
      - run: npm run patches:gc

      - name: Commit
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/patches public/pd4web-runtime docs/musico "app/[locale]/map3/pd4web-patches.generated.ts"
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "build(patches): artefatos de ${{ join(fromJSON(needs.detect.outputs.slugs), ', ') }} [skip ci]"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Comentar no PR
        uses: actions/github-script@v7
        with:
          script: |
            const { execFileSync } = require("child_process");
            const slugs = ${{ needs.detect.outputs.slugs }};

            // The Vercel preview URL is not known yet at this point; the
            // patch-preview workflow rewrites this comment with real links as
            // soon as the deployment reports success.
            const body = execFileSync(
              "node",
              ["scripts/render-preview-comment.mjs", "", ...slugs],
              { encoding: "utf8" },
            );

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const previous = comments.find((c) => c.body.includes("<!-- gaia-patch-bot -->"));
            if (previous) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
